<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9LVXRHSSHS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9LVXRHSSHS');
    </script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password - AnimeMOSS</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <a class="auth-brand" href="index.html">
            Anime<span>MOSS</span>
            <span class="auth-brand-icon">▶</span>
        </a>

        <section class="auth-card">

            <h1 class="auth-title">Reset Password</h1>

            <p class="auth-subtitle">
                Choose a new password for your AnimeMOSS account.
            </p>

            <div
                id="auth-message"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

            <form
                id="reset-password-form"
                class="auth-form"
                novalidate
            >

                <div class="auth-field">

                    <label for="reset-password">
                        New Password
                    </label>

                    <div class="auth-password-wrap">
                        <input
                            id="reset-password"
                            name="newPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            placeholder="At least 8 characters"
                            required
                        >

                        <button
                            class="auth-password-toggle"
                            type="button"
                            data-password-toggle="#reset-password"
                        >
                            Show
                        </button>
                    </div>

                </div>

                <div class="auth-field">

                    <label for="reset-confirm-password">
                        Confirm New Password
                    </label>

                    <div class="auth-password-wrap">
                        <input
                            id="reset-confirm-password"
                            name="confirmPassword"
                            type="password"
                            autocomplete="new-password"
                            minlength="8"
                            maxlength="128"
                            placeholder="Enter the password again"
                            required
                        >

                        <button
                            class="auth-password-toggle"
                            type="button"
                            data-password-toggle="#reset-confirm-password"
                        >
                            Show
                        </button>
                    </div>

                </div>

                <button
                    id="reset-submit"
                    class="auth-submit"
                    type="submit"
                >
                    Reset Password
                </button>

            </form>

            <div class="auth-footer">
                <a href="login.html">← Back to Login</a>
            </div>

        </section>

    </main>

    <script src="js/reset-password.js"></script>

</body>
</html>
