        }

<body>
    <div class="watch-page"><div class="watch-layout"><main class="watch-main">

        <div class="watch-top">
            <a id="back-btn" class="back-btn" href="#">← Back</a>
            <h1 id="watch-title" class="watch-title">Loading...</h1>

            <div id="auth-compact" class="auth-compact">
                <a href="login.html">Login</a>
            </div>
        </div>

        <div class="player-box">
            <video id="video-player" controls playsinline preload="metadata"></video>
        </div>

        <div class="controls-row">
            <div class="mode-switcher" id="mode-switcher">
                <button id="sub-mode-btn" class="mode-btn active" type="button">
                    SUB
                </button>
                <button id="dub-mode-btn" class="mode-btn" type="button" hidden>
                    DUB
                </button>
            </div>

            <div>
                <button id="download-episode-btn" class="mode-btn" type="button">
                    Download Episode
                </button>
            </div>
        </div>

        <div id="status-text" class="status-text">
            Loading episode...
        </div>

        <h2 class="section-title">Seasons</h2>

        <div id="season-list" class="season-list">
            <span class="episode-loading">Loading seasons...</span>
        </div>

        <div class="episodes-heading">
            <h2 class="section-title">Episodes</h2>
            <div id="episode-range" class="episode-range">
                <button id="episode-range-btn" class="episode-range-btn" type="button" aria-haspopup="listbox" aria-expanded="false">
                    <span id="episode-range-label">Episodes</span>
                    <span class="episode-range-arrow">⌄</span>
                </button>
                <div id="episode-range-menu" class="episode-range-menu" role="listbox"></div>
            </div>
        </div>

        <div id="episode-list" class="episode-list">
            <span class="episode-loading">Loading episodes...</span>
        </div>

        <section class="comments-section" aria-labelledby="comments-title">
            <div class="comments-heading">
                <h2 id="comments-title" class="section-title">Comments</h2>
                <span id="comments-count" class="comments-count">0</span>
            </div>

            <div id="comments-auth-box"></div>

            <form id="comment-form" class="comments-form" hidden>
                <textarea
                    id="comment-input"
                    class="comments-textarea"
                    maxlength="1000"
                    placeholder="Write a comment..."
                    required
                ></textarea>

                <div class="comments-form-footer">
                    <span id="comments-character-count" class="comments-character-count">0/1000</span>
                    <button id="comment-submit" class="comments-submit" type="submit">
                        Post Comment
                    </button>
                </div>
            </form>

            <div id="comments-status" class="comments-status"></div>

            <div id="comments-list"></div>

            <button
                id="comments-load-more"
                class="comments-load-more"
                type="button"
                hidden
            >
                Load more comments
            </button>
        </section>



            </main>
            <aside class="similar-panel">
                <h2 class="similar-heading">Similar Anime</h2>
                <div id="similar-list" class="similar-list">
                    <div class="similar-empty">Finding similar titles...</div>
                </div>
            </aside>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);

        const animeId = Number(params.get("id"));
        let currentEpisode = Number(params.get("episode")) || 1;
        let currentMode = params.get("type") === "dub" ? "dub" : "sub";

        const video = document.getElementById("video-player");
        const subModeBtn = document.getElementById("sub-mode-btn");
        const dubModeBtn = document.getElementById("dub-mode-btn");
        const episodeList = document.getElementById("episode-list");
        const episodeRange = document.getElementById("episode-range");
        const episodeRangeBtn = document.getElementById("episode-range-btn");
        const episodeRangeLabel = document.getElementById("episode-range-label");
        const episodeRangeMenu = document.getElementById("episode-range-menu");
        let totalEpisodeCount = 0;
        const EPISODES_PER_RANGE = 50;
        const seasonList = document.getElementById("season-list");
        const similarList = document.getElementById("similar-list");
        const statusText = document.getElementById("status-text");
        const watchTitle = document.getElementById("watch-title");
const backBtn = document.getElementById("back-btn");

        let hls = null;

        function updateModeButtons(availableModes) {
            const modes = new Set(
                Array.isArray(availableModes) ? availableModes : []
            );

            modes.add(currentMode);

function playSource(sourceUrl, onFatal) {
            destroyHls();

            video.pause();
            video.removeAttribute("src");
            video.load();

            const isHls = /\.m3u8($|\?)/i.test(sourceUrl);

            if (isHls) {
                if (window.Hls && Hls.isSupported()) {
                    hls = new Hls({
                        enableWorker: true,
                        lowLatencyMode: true
                    });

                    let failed = false;

                    hls.loadSource(sourceUrl);
                    hls.attachMedia(video);

                    hls.on(Hls.Events.MANIFEST_PARSED, () => {
                        video.play().catch(() => { });
                    });

                    hls.on(Hls.Events.ERROR, (event, data) => {
                        console.error("HLS error:", data);

                        if (data.fatal && !failed) {
                            failed = true;
                            destroyHls();

                            if (typeof onFatal === "function") {
                                onFatal();
                            }
                        }
                    });
                } else if (video.canPlayType("application/vnd.apple.mpegurl")) {
                    let failed = false;

                    video.src = sourceUrl;

                    video.addEventListener(
                        "loadedmetadata",
                        () => {
                            video.play().catch(() => { });
                        },
                        { once: true }
                    );

                    video.addEventListener(
                        "error",
                        () => {
                            if (!failed) {
                                failed = true;

                                if (typeof onFatal === "function") {
                                    onFatal();
                                }
                            }
                        },
                        { once: true }
                    );
                } else {
                    throw new Error(
                        "This browser does not support HLS playback."
                    );
                }

                return;
            }

            video.src = sourceUrl;
            video.load();
            video.play().catch(() => { });
        }

        function playSources(sources) {
            const uniqueSources = [...new Set(
                sources.filter(Boolean)
            )];

            if (!uniqueSources.length) {
                throw new Error("No playable sources");
            }

            let index = 0;

            const tryNext = () => {
                if (index >= uniqueSources.length) {
                    statusText.textContent = "All video sources failed.";
                    statusText.classList.add("error-text");
                    return;
                }

                const source = uniqueSources[index++];

                statusText.textContent =
                    `Trying video source ${index}/${uniqueSources.length}...`;

                playSource(source, tryNext);
            };

            tryNext();
        }

function createSeasonButtons(seasons) {
    let list = Array.isArray(seasons) ? [...seasons] : [];

    seasonList.innerHTML = "";

    if (!list.length) return;

    function getSeasonNumber(title) {
        const text = String(title || "");

        let m = text.match(/\\bSeason\\s+(\\d+)\\b/i);
        if (m) return Number(m[1]);

        m = text.match(/\\b(\\d+)(?:st|nd|rd|th)\\s+Season\\b/i);
        if (m) return Number(m[1]);

        m = text.match(/\\bS(\\d+)\\b/i);
        if (m) return Number(m[1]);

        const roman = {
            I: 1, II: 2, III: 3, IV: 4, V: 5,
            VI: 6, VII: 7, VIII: 8, IX: 9, X: 10
        };

        m = text.match(/(?:^|\\s)(I|II|III|IV|V|VI|VII|VIII|IX|X)(?:\\s|:|-|$)/i);
        if (m) {
            const n = roman[m[1].toUpperCase()];
            if (n) return n;
        }

        // Common numbered sequel naming, e.g. Mushoku Tensei II / III
        m = text.match(/\\b(?:Tensei|Reincarnation|Season)?\\s*(II|III|IV|V|VI)\\b/i);
        if (m) {
            const n = roman[m[1].toUpperCase()];
            if (n) return n;
        }

        return null;
    }

    function getPartNumber(title) {
        const m = String(title || "").match(/\\bPart\\s+(\\d+)\\b/i);
        return m ? Number(m[1]) : 0;
    }

    list = list.filter(item =>
        String(item?.format || "").toUpperCase() === "TV"
    );

    list.sort((a, b) => {
        const at = a?.title?.english || a?.title?.romaji || "";
        const bt = b?.title?.english || b?.title?.romaji || "";

        const an = getSeasonNumber(at);
        const bn = getSeasonNumber(bt);

        if (an !== null && bn !== null && an !== bn) {
            return an - bn;
        }

        if (an !== null && bn === null) return -1;
        if (an === null && bn !== null) return 1;

        const ap = getPartNumber(at);
        const bp = getPartNumber(bt);

        if (an !== null && bn !== null && ap !== bp) {
            return ap - bp;
        }

        const ay = Number(a?.year || 9999);
        const by = Number(b?.year || 9999);

        if (ay !== by) return ay - by;

        return at.localeCompare(bt);
    });

    list.forEach((season) => {
        const rawTitle =
            season.title?.english ||
            season.title?.romaji ||
            season.title?.native ||
            "";

        const seasonNumber = getSeasonNumber(rawTitle);
        const partNumber = getPartNumber(rawTitle);

        const button = document.createElement("button");
        button.className = "season-btn";
        button.type = "button";

        if (Number(season.id) === Number(animeId)) {
            button.classList.add("active");
        }

        const poster = document.createElement("img");
        poster.className = "season-poster";
        poster.loading = "lazy";
        poster.src =
            season.coverImage?.extraLarge ||
            season.coverImage?.large ||
            season.coverImage?.medium ||
            "";
        poster.alt = "Season";

        const info = document.createElement("div");
        info.className = "season-info";

        const label = document.createElement("span");
        label.className = "season-label";

        if (seasonNumber) {
            label.textContent =
                "Season " +
                seasonNumber +
                (partNumber > 0 ? " Part " + partNumber : "");
        } else {
            label.textContent = rawTitle;
        }

        const meta = document.createElement("span");
        meta.className = "season-meta";
        meta.textContent =
            [season.format, season.year]
                .filter(Boolean)
                .join(" · ");

        info.appendChild(label);
        info.appendChild(meta);

        button.appendChild(poster);
        button.appendChild(info);

        button.addEventListener("click", () => {
            window.location.href =
                "watch.html?id=" +
                encodeURIComponent(season.id) +
                "&episode=1&type=" +
                encodeURIComponent(currentMode);
        });

        seasonList.appendChild(button);
    });
}

                    if (Array.isArray(cachedData.seasons)) {

                try {

                        `https://animemoss-api-production.up.railway.app/seasons/${requestedAnimeId}`,
                        {
                            signal: controller.signal,
                            cache: "no-store"
                        }
                    );

                    clearTimeout(timeout);

                        throw new Error(`Season API ${response.status}`);

                    const data = await response.json();

            avatar.className = "comment-avatar";
            avatar.textContent = getCommentInitial(comment);

            const author = document.createElement("span");
            author.className = "comment-author";
            author.textContent = getCommentAuthor(comment);

            const time = document.createElement("span");
            time.className = "comment-time";

            const createdAt = Number(comment.createdAt || comment.created_at);
            const updatedAt = Number(comment.updatedAt || comment.updated_at);

            time.textContent = formatCommentDate(createdAt);

            if (
                updatedAt &&
                createdAt &&
                updatedAt > createdAt + 1000 &&
                comment.content !== "[deleted]"
            ) {
                time.textContent += " · edited";
            }

            header.append(avatar, author, time);

            const content = document.createElement("div");
            content.className = "comment-content";
            content.textContent = escapeCommentText(comment.content);

            wrapper.append(header, content);

            if (comment.content !== "[deleted]" && commentsUser) {
                const actions = document.createElement("div");
                actions.className = "comment-actions";

                if (!isReply) {
                    actions.appendChild(
                        createCommentAction("Reply", () => {
                            const existing = wrapper.querySelector(".comment-reply-form");

                            if (existing) {
                                existing.remove();
                                return;
                            }

                            wrapper.appendChild(buildCommentForm(comment, "reply"));
                        })
                    );
                }

                if (comment.canEdit) {
                    actions.appendChild(
                        createCommentAction("Edit", () => {
                            const existing = wrapper.querySelector(".comment-edit-form");

                            if (existing) {
                                existing.remove();
                                return;
                            }

                            wrapper.appendChild(buildCommentForm(comment, "edit"));
                        })
                    );
                }

                if (comment.canDelete) {
                    actions.appendChild(
                        createCommentAction("Delete", async () => {
                            if (!confirm("Delete this comment?")) {
                                return;
                            }

                            try {
                                await commentsRequest(`/api/comments/${comment.id}`, {
                                    method: "DELETE"
                                });

                                await loadCommentsForEpisode(currentEpisode, true);
                            } catch (error) {
                                alert(error.message);
                            }
                        })
                    );
                }

                wrapper.appendChild(actions);
            }

            return wrapper;
        }

        function renderComments(comments, append = false) {
            if (!append) {
                commentsList.textContent = "";
            }

            if (!append && comments.length === 0) {
                const empty = document.createElement("div");
                empty.className = "comments-empty";
                empty.textContent = "No comments yet. Be the first to comment.";
                commentsList.appendChild(empty);
                return;
            }

            for (const comment of comments) {
                const item = renderSingleComment(comment);

                if (Array.isArray(comment.replies) && comment.replies.length) {
                    const replies = document.createElement("div");
                    replies.className = "comment-replies";

                    for (const reply of comment.replies) {
                        replies.appendChild(renderSingleComment(reply, true));
                    }

                    item.appendChild(replies);
                }

                commentsList.appendChild(item);
            }
        }

        async function loadCommentsForEpisode(episode, reset = true) {
            const requestId = ++commentsRequestId;

            if (reset) {
                commentsPage = 1;
                commentsHasMore = false;
                commentsTotal = 0;
                commentsList.textContent = "";
                commentsLoadMore.hidden = true;
            }

            setCommentsStatus("Loading comments...");

            try {
                const data = await commentsRequest(
                    `/api/comments/${animeId}/${episode}?page=${commentsPage}`
                );

                if (requestId !== commentsRequestId) {
                    return;
                }

                commentsHasMore = Boolean(data.hasMore);
                commentsTotal = Number(data.total || 0);

                commentsCount.textContent = String(commentsTotal);

                renderComments(
                    Array.isArray(data.comments) ? data.comments : [],
                    !reset
                );

                commentsLoadMore.hidden = !commentsHasMore;
                commentsLoadMore.disabled = false;

                setCommentsStatus("");
            } catch (error) {
                if (requestId !== commentsRequestId) {
                    return;
                }

                commentsList.textContent = "";

                const errorBox = document.createElement("div");
                errorBox.className = "comments-empty";
                errorBox.textContent = "Could not load comments. Please try again.";

                commentsList.appendChild(errorBox);
                commentsLoadMore.hidden = true;
                setCommentsStatus(error.message);
            }
        }

        async function initializeComments() {
            try {
                commentsUser = await AnimeMossAuth.getCurrentUser();
            } catch {
                commentsUser = null;
            }

            renderCommentsAuth();

            if (commentsUser) {
                setCommentsStatus("");
            }

            await loadCommentsForEpisode(currentEpisode, true);
        }

        commentInput.addEventListener("input", updateCommentCharacterCount);

        commentForm.addEventListener("submit", async (event) => {
            event.preventDefault();

            const content = commentInput.value.trim();

            if (!content) {
                commentInput.focus();
                return;
            }

            commentSubmit.disabled = true;
            setCommentsStatus("Posting comment...");

            try {
                await commentsRequest(`/api/comments/${animeId}/${currentEpisode}`, {
                    method: "POST",
                    body: JSON.stringify({ content })
                });

                commentInput.value = "";
                updateCommentCharacterCount();

                await loadCommentsForEpisode(currentEpisode, true);
            } catch (error) {
                if (error.status === 401) {
                    commentsUser = null;
                    renderCommentsAuth();
                }

                setCommentsStatus(error.message);
            } finally {
                commentSubmit.disabled = false;
            }
        });

        commentsLoadMore.addEventListener("click", async () => {
            if (!commentsHasMore) {
                return;
            }

            commentsLoadMore.disabled = true;
            commentsPage += 1;

            try {
                await loadCommentsForEpisode(currentEpisode, false);
            } finally {
                commentsLoadMore.disabled = false;
            }
        });

        /*
         * Wrap the existing episode loader.
         * The existing player logic stays untouched.
         */
        const originalAnimeMossLoadEpisode = loadEpisode;

        loadEpisode = async function(episode) {
            const result = await originalAnimeMossLoadEpisode(episode);

            if (episode === currentEpisode) {
                loadCommentsForEpisode(episode, true);
            }

            return result;
        };

        updateCommentCharacterCount();
        initializeComments();


        async function loadEpisodeCount() {
            try {
                const response = await fetch(
                    `https://animemoss-api-production.up.railway.app/episodes/${animeId}`
                );

                if (!response.ok) return;

                const data = await response.json();
                const episodes = Array.isArray(data)
                    ? data
                    : (data.episodes || []);

                if (episodes.length) {
                    createEpisodeButtons(episodes.length);
                }
            } catch (error) {
                console.warn("Episode list unavailable:", error);
            }
        }

        /*
         * IMPORTANT:
         * Episode list loads separately in the background.
         * It does NOT block video playback.
         */
        loadSeasons();
    loadEpisodeCount();
    loadSimilarAnime();

        /*
         * Video starts independently.
         */
        loadEpisode(currentEpisode);
    </script>

    <script src="js/auth-ui.js"></script>

</body>
