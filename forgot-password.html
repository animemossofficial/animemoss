<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-9LVXRHSSHS"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-9LVXRHSSHS');
    </script>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Forgot Password - AnimeMOSS</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <a class="auth-brand" href="index.html">
            Anime<span>MOSS</span>
            <span class="auth-brand-icon">▶</span>
        </a>

        <section class="auth-card">

            <h1 class="auth-title">Forgot your password?</h1>

            <p class="auth-subtitle">
                Enter your email address and we will send you a password
                reset link if an account exists.
            </p>

            <div
                id="auth-message"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

            <form
                id="forgot-password-form"
                class="auth-form"
                novalidate
            >

                <div class="auth-field">
                    <label for="forgot-email">Email</label>

                    <input
                        id="forgot-email"
                        name="email"
                        type="email"
                        autocomplete="email"
                        placeholder="you@example.com"
                        maxlength="254"
                        required
                    >
                </div>

                <button
                    id="forgot-submit"
                    class="auth-submit"
                    type="submit"
                >
                    Send Reset Code
                </button>

            </form>

            <div class="auth-footer">
                Remember your password?
                <a href="login.html">Sign In</a>
            </div>

            <a
                class="auth-home-link"
                href="index.html"
            >
                ← Back to AnimeMOSS
            </a>

        </section>

    </main>

    <script src="js/forgot-password.js"></script>

</body>
</html>
