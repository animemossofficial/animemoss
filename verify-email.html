<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Verify Email - AnimeMOSS</title>

    <link rel="stylesheet" href="css/auth.css">
</head>

<body class="auth-page">

    <main class="auth-wrapper">

        <a class="auth-brand" href="index.html">
            Anime<span>MOSS</span>
            <span class="auth-brand-icon">▶</span>
        </a>

        <section class="auth-card">

            <h1 id="verify-title" class="auth-title">
                Verify your email
            </h1>

            <p id="verify-subtitle" class="auth-subtitle">
                Checking your verification link...
            </p>

            <div
                id="auth-message"
                class="auth-message"
                role="alert"
                aria-live="polite"
            ></div>

            <a
                id="verify-action"
                class="auth-submit"
                href="login.html"
                style="display:none; text-align:center; text-decoration:none; line-height:50px;"
            >
                Continue to Login
            </a>

            <a
                class="auth-home-link"
                href="index.html"
            >
                ← Back to AnimeMOSS
            </a>

        </section>

    </main>

    <script src="js/verify-email.js"></script>

</body>
</html>
