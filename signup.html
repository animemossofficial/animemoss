<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account - AnimeMOSS</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-wrapper">
<a class="auth-brand" href="index.html">Anime<span>MOSS</span><span class="auth-brand-icon">▶</span></a>
<section class="auth-card">
<h1 class="auth-title">Create your account</h1>
<p class="auth-subtitle">Join AnimeMOSS and keep your account experience connected.</p>
<div id="auth-message" class="auth-message" role="alert" aria-live="polite"></div>
<form id="signup-form" class="auth-form" novalidate>
<div class="auth-field"><label for="signup-username">Username</label><input id="signup-username" name="username" type="text" autocomplete="username" placeholder="Choose a username" minlength="3" maxlength="20" required><div class="auth-hint">3–20 characters. Letters, numbers and underscores only.</div></div>
<div class="auth-field"><label for="signup-name">Display Name</label><input id="signup-name" name="displayName" type="text" autocomplete="name" placeholder="Your name" minlength="2" maxlength="32" required></div>
<div class="auth-field"><label for="signup-email">Email</label><input id="signup-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required></div>
<div class="auth-field"><label for="signup-password">Password</label><div class="auth-password-wrap"><input id="signup-password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" maxlength="128" required><button class="auth-password-toggle" type="button" data-password-toggle="#signup-password">Show</button></div></div>
<div class="auth-field"><label for="signup-confirm-password">Confirm Password</label><div class="auth-password-wrap"><input id="signup-confirm-password" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter the password again" minlength="8" maxlength="128" required><button class="auth-password-toggle" type="button" data-password-toggle="#signup-confirm-password">Show</button></div></div>
<button id="signup-submit" class="auth-submit" type="submit">Create Account</button>
</form>
<div class="auth-divider"><span>OR</span></div>
<a class="auth-google-button" href="https://animemoss-api-production.up.railway.app/auth/google"><span class="auth-google-icon">G</span>Continue with Google</a>
<div class="auth-footer">Already have an account? <a href="login.html">Sign In</a></div>
<a class="auth-home-link" href="index.html">← Back to AnimeMOSS</a>
</section>
</main>
<script src="js/auth.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
