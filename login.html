<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In - AnimeMOSS</title>
<link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-page">
<main class="auth-wrapper">
<a class="auth-brand" href="index.html">Anime<span>MOSS</span><span class="auth-brand-icon">▶</span></a>
<section class="auth-card">
<h1 class="auth-title">Welcome back</h1>
<p class="auth-subtitle">Sign in to continue your AnimeMOSS experience.</p>
<div id="auth-message" class="auth-message" role="alert" aria-live="polite"></div>
<form id="login-form" class="auth-form" novalidate>
<div class="auth-field">
<label for="login-email">Email</label>
<input id="login-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" maxlength="254" required>
</div>
<div class="auth-field">
<label for="login-password">Password</label>
<div class="auth-password-wrap">
<input id="login-password" name="password" type="password" autocomplete="current-password" placeholder="Enter your password" maxlength="128" required>
<button class="auth-password-toggle" type="button" data-password-toggle="#login-password">Show</button>
</div>
<div style="text-align:right;margin-top:8px"><a href="forgot-password.html" class="auth-forgot-link">Forgot Password?</a></div>
</div>
<button id="login-submit" class="auth-submit" type="submit">Sign In</button>
</form>
<div class="auth-divider"><span>OR</span></div>
<a class="auth-google-button" href="https://animemoss-api-production.up.railway.app/auth/google"><span class="auth-google-icon">G</span>Continue with Google</a>
<div class="auth-footer">Don't have an account? <a href="signup.html">Create Account</a></div>
<a class="auth-home-link" href="index.html">← Back to AnimeMOSS</a>
</section>
</main>
<script src="js/auth.js"></script>
<script src="js/auth-page.js"></script>
</body>
</html>
